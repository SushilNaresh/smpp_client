group = core
admin-port = 13000
smsbox-port = 13001
admin-password = bar
log-file = "/tmp/kannel_load/bearerbox.log"
log-level = 0
box-deny-ip = "*.*.*.*"
box-allow-ip = "127.0.0.1"
store-type = redis
store-location = redis_store_conn
dlr-storage = redis
access-log = /tmp/kannel_load/access.log
access-log-clean = true
access-log-format = "%t %l [ID:%I] [FID:%F] [SMSC:%i] [ACT:%A] [from:%p] [to:%P] [dlr:%d] [url:%R]"
smsbox-max-pending = 500

group = redis-connection
id = redis_store_conn
host = localhost
port = 6379
database = 1
max-connections = 10

group = store-db
id = redis_store_conn
table = kannel_test_store
hash = no

group = redis-connection
id = redis_dlr_conn
host = localhost
port = 6379
database = 2
max-connections = 10

group = dlr-db
id = redis_dlr_conn
table = kannel_dlr
field-smsc = smsc
field-timestamp = ts
field-source = src
field-destination = dst
field-service = svc
field-url = url
field-mask = mask
field-status = status
field-boxc-id = boxc
ttl = 86400

group = smsc
smsc = smpp
smsc-id = smpp_tx
host = 127.0.0.1
port = 2345
system-type = "VMA"
address-range = ""
smsc-username = "foo"
smsc-password = "bar"
max-pending-submits = 100

group = smsc
smsc = smpp
smsc-id = smpp_rx
host = 127.0.0.1
receive-port = 2345
system-type = "VMA"
address-range = ""
smsc-username = "foo"
smsc-password = "bar"

group = smpp-tlv
name = my_receipted_message_id
tag = 0x001E
type = octetstring
length = 65

group = smsbox
smsbox-id = smsbox1
bearerbox-host = 127.0.0.1
sendsms-port = 13013
global-sender = 123
log-file = "/tmp/kannel_load/smsbox1.log"
log-level = 0
max-pending-requests = 512
http-request-retry = 0
http-timeout = 10

group = sendsms-user
username = foo
password = bar
max-messages = 10

group = sms-service
keyword = default
text = "No service specified"
